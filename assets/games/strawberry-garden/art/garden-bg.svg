<g fill="#2d9447">
 <ellipse cx="245" cy="445" rx="58" ry="34"/><ellipse cx="330" cy="425" rx="58" ry="34"/><ellipse cx="420" cy="445" rx="58" ry="34"/><ellipse cx="510" cy="425" rx="58" ry="34"/><ellipse cx="600" cy="445" rx="58" ry="34"/><ellipse cx="690" cy="425" rx="58" ry="34"/>
 <ellipse cx="285" cy="500" rx="62" ry="35"/><ellipse cx="380" cy="520" rx="62" ry="35"/><ellipse cx="480" cy="495" rx="62" ry="35"/><ellipse cx="580" cy="520" rx="62" ry="35"/><ellipse cx="675" cy="500" rx="62" ry="35"/>
</g>
<g fill="#66c95a" opacity=".9">
 <ellipse cx="230" cy="430" rx="32" ry="18"/><ellipse cx="315" cy="410" rx="32" ry="18"/><ellipse cx="405" cy="430" rx="32" ry="18"/><ellipse cx="495" cy="410" rx="32" ry="18"/><ellipse cx="585" cy="430" rx="32" ry="18"/><ellipse cx="675" cy="410" rx="32" ry="18"/>
</g>
