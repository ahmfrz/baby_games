<g>
 <path d="M65 310 L88 175 L112 310Z" fill="#80502e"/><circle cx="75" cy="170" r="65" fill="#45a84d"/><circle cx="125" cy="165" r="55" fill="#57bb52"/><circle cx="105" cy="125" r="48" fill="#66c95a"/>
