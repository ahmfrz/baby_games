<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600">
<defs>
 <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#62d8ff"/><stop offset="1" stop-color="#d9f7ff"/></linearGradient>
 <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#9de35b"/><stop offset="1" stop-color="#58bb55"/></linearGradient>
 <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#52b94f"/><stop offset="1" stop-color="#2e9148"/></linearGradient>
 <linearGradient id="soil" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#a86b3d"/><stop offset="1" stop-color="#704328"/></linearGradient>
</defs>
<rect width="960" height="600" fill="url(#sky)"/>
<!-- sun --> <circle cx="830" cy="92" r="52" fill="#ffd85a" opacity=".9"/><circle cx="830" cy="92" r="72" fill="#fff3a8" opacity=".28"/>
<!-- clouds -->
<g fill="#fff" opacity=".9"><ellipse cx="135" cy="88" rx="70" ry="27"/><ellipse cx="88" cy="96" rx="38" ry="25"/><ellipse cx="180" cy="100" rx="43" ry="22"/><ellipse cx="690" cy="125" rx="68" ry="24"/><ellipse cx="650" cy="132" rx="35" ry="22"/><ellipse cx="735" cy="135" rx="42" ry="20"/></g>
