 <g transform="translate(75 430)"><circle r="10" fill="#ffd34e"/><g fill="#fff"><circle cy="-18" r="12"/><circle cy="18" r="12"/><circle cx="-18" cy="0" r="12"/><circle cx="18" cy="0" r="12"/></g></g>
 <g transform="translate(875 445)"><circle r="10" fill="#ffd34e"/><g fill="#fff"><circle cy="-18" r="12"/><circle cy="18" r="12"/><circle cx="-18" cy="0" r="12"/><circle cx="18" cy="0" r="12"/></g></g>
 <g transform="translate(130 520)"><circle r="9" fill="#ffd34e"/><g fill="#ff7b9b"><circle cy="-16" r="11"/><circle cy="16" r="11"/><circle cx="-16" cy="0" r="11"/><circle cx="16" cy="0" r="11"/></g></g>
</g>
